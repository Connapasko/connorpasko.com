<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WOAH! GAME!!!!</title>
    <link rel="stylesheet" href="/assets/invade-style.css" />
  </head>

  <body>
    <main class="game-shell">
      <div class="game-top">
        <h1>WOAH! GAME!!!!!</h1>
        <div class="stats">

          <span>Lives: <strong id="lives">3</strong></span>
